<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="50" cy="93" rx="34" ry="6" fill="url(#shadow)"/>

  <!-- top face: lightest, single flat tone -->
  <polygon points="50,8 86,28 50,48 14,28" fill="#3d3d3d"/>
  <polygon points="50,8 86,28 50,48 14,28" fill="none" stroke="#000" stroke-opacity="0.2" stroke-width="0.5"/>

  <!-- left face: medium tone (lit side) -->
  <polygon points="14,28 50,48 50,90 14,70" fill="#1c1c1c"/>
  <!-- right face: darkest tone (shadow side) -->
  <polygon points="86,28 50,48 50,90 86,70" fill="#0a0a0a"/>

  <!-- kiswa gold band, left face: brighter gold -->
  <polygon points="14,48 50,68 50,77 14,57" fill="#caa12f"/>
  <!-- kiswa gold band, right face: darker gold -->
  <polygon points="86,48 50,68 50,77 86,57" fill="#8c6c1d"/>

  <!-- woven texture lines on the gold band -->
  <g stroke="#5e4310" stroke-width="0.4" stroke-opacity="0.4">
    <line x1="18" y1="50.3" x2="18" y2="59.3"/>
    <line x1="24" y1="53.6" x2="24" y2="62.6"/>
    <line x1="30" y1="56.9" x2="30" y2="65.9"/>
    <line x1="36" y1="60.1" x2="36" y2="69.1"/>
    <line x1="42" y1="63.4" x2="42" y2="72.4"/>
    <line x1="82" y1="50.3" x2="82" y2="59.3"/>
    <line x1="76" y1="53.6" x2="76" y2="62.6"/>
    <line x1="70" y1="56.9" x2="70" y2="65.9"/>
    <line x1="64" y1="60.1" x2="64" y2="69.1"/>
    <line x1="58" y1="63.4" x2="58" y2="72.4"/>
  </g>

  <!-- thin gold trim lines top & bottom of band -->
  <polyline points="14,48 50,68 86,48" fill="none" stroke="#e8c96a" stroke-width="0.6" stroke-opacity="0.8"/>
  <polyline points="14,57 50,77 86,57" fill="none" stroke="#4a3410" stroke-width="0.6" stroke-opacity="0.6"/>

  <!-- door (multazam) on left face -->
  <path d="M27,80 L27,73 C27,70.5 29,69 31,69 C33,69 35,70.5 35,73 L35,80 Z"
        fill="#e7e7e7" stroke="#8c6c1d" stroke-width="0.6"/>

  <!-- subtle top-edge highlight for extra depth -->
  <polyline points="14,28 50,8 86,28" fill="none" stroke="#6e6e6e" stroke-width="0.6" stroke-opacity="0.5"/>

  <!-- vertical corner seam line -->
  <line x1="50" y1="48" x2="50" y2="90" stroke="#000" stroke-opacity="0.3" stroke-width="0.4"/>
</svg>
